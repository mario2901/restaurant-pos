plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'megi-backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'   // @Valid na DTO-ovima

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'com.h2database:h2'          // baza za prototip; kasnije MySQL/Postgres

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

// React build (megi-frontend/dist) -> static/ u JAR-u.
// Redoslijed: u megi-frontend "npm run build", zatim ovdje "./gradlew bootJar".
// Ako dist ne postoji (npr. dev), ništa se ne kopira. Ako si dist ručno kopirao
// u src/main/resources/static, ta kopija ima prednost (EXCLUDE duplikata).
tasks.named('processResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from('../megi-frontend/dist') {
        into 'static'
    }
}

// Jedan izvršni JAR: build/libs/megi.jar (backend + frontend iz megi-frontend/dist)
tasks.named('bootJar') {
    archiveFileName = 'megi.jar'
}
// bez dodatnog "-plain" JAR-a koji nam ne treba
tasks.named('jar') {
    enabled = false
}
