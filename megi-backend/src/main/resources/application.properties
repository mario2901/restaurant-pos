spring.application.name=megi-backend

# H2 file baza za prototip (podaci prezive restart) - kasnije PostgreSQL
# AUTO_SERVER=TRUE: prvi proces otvara bazu, ostali se kace na njega.
# Bez toga H2 zakljuca .mv.db pa druga instanca (ili ostali Run tab u
# IntelliJ-u) puca s "Database may be already in use".
spring.datasource.url=jdbc:h2:file:./data/megi;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Ostavljeno na true (Spring Boot default): kontroleri mapiraju entitete u DTO
# izvan transakcije, pa bi s false lazy kolekcije pucale. Za promet jednog
# restorana je to u redu; N+1 na izvjestajima je rijesen fetch join upitima.
spring.jpa.open-in-view=true

# Ne vracaj null polja u JSON-u
spring.jackson.default-property-inclusion=non_null

# TODO PRIVREMENO: dok traje testiranje pica su uvijek dostupna — zaliha se
# ne provjerava ni ne skida pri narucivanju. Vrati na true kad krene pravi rad.
app.stock.check-enabled=false
