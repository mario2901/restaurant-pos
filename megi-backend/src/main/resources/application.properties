spring.application.name=megi-backend

# H2 file baza za prototip (podaci prezive restart) - kasnije PostgreSQL
# AUTO_SERVER=TRUE: prvi proces otvara bazu, ostali se kace na njega.
# Bez toga H2 zakljuca .mv.db pa druga instanca (ili ostali Run tab u
# IntelliJ-u) puca s "Database may be already in use".
# Apsolutna putanja — baza je uvijek ista bez obzira odakle se backend pokrene.
# Promjena bez rebuilda: varijabla okoline MEGI_DB_PATH (npr. D:/megi/data/megi).
# H2 sam kreira folder ako ne postoji.
spring.datasource.url=jdbc:h2:file:${MEGI_DB_PATH:C:/megi/data/megi};DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Ostavljeno na true (Spring Boot default): kontroleri mapiraju entitete u DTO
# izvan transakcije, pa bi s false lazy kolekcije pucale. Za promet jednog
# restorana je to u redu; N+1 na izvjestajima je rijesen fetch join upitima.
spring.jpa.open-in-view=true

# Ne vracaj null polja u JSON-u
spring.jackson.default-property-inclusion=non_null

# TODO PRIVREMENO: dok traje testiranje pica su uvijek dostupna — zaliha se
# ne provjerava ni ne skida pri narucivanju. Vrati na true kad krene pravi rad.

# Početak radnog dana. Restoran radi 07-23, pa je radni dan = kalendarski dan
# (isto kao u izvještajima).
app.business-day.start=00:00

# Automatsko zatvaranje (gleda se vrijeme KREIRANJA narud?be).
# Vrijeme i cron moraju odgovarati jedno drugom (cron: sek min sat dan mjesec danUTjednu).
app.auto-close.delivery-time=15:30
app.auto-close.all-time=22:40

# Sigurnosna mre?a
app.auto-close.cron=0 59 23 * * *

# ==================== PRINTERI (Datecs EP-2000, LAN) ====================
# false = backend ne printa, frontend printa kroz browser (za razvoj bez printera)
app.printer.enabled=true
# Kuhinja je na LAN-u: staticki IP postavljen skriptom megi/datecs-ip.ps1
app.printer.kitchen.host=192.168.123.201
app.printer.kitchen.port=9100
# Sank je na USB-u: ime printera iz Windows postavki (driver Generic / Text Only).
# Ako ostane prazno, koristi se host/port (LAN).
app.printer.bar.windows-name=SANK
app.printer.bar.host=
app.printer.bar.port=9100
# Kodna stranica (Datecs ESC u n): 4 = Latin 2 / CP852, 14 = CP1250
app.printer.charset=Cp852
app.printer.code-page=4
# true = salje c/c/z/s/dj bez kvacica (ako dijakritici izlaze kao smece)
app.printer.transliterate=false
# 80 mm papir, font A = 48 znakova
app.printer.width=48
app.printer.timeout-ms=3000
# kuhinjski printer zapisti kad stigne tiket
app.printer.kitchen-beep=true
app.printer.currency=KM

# LAN: koliko dugo (ms) drzati vezu otvorenom nakon slanja (+1 ms po bajtu).
# Datecs baci neisprintani dio posla ako se veza zatvori prerano.
app.printer.lan-close-delay-ms=2000

# Zaglavlje restorana na tiketima šanka (račun, storno šank, izvještaj)
app.printer.header[0]=PIZZERIA "MEGI DEA"
app.printer.header[1]=Vl. Dragica Brtan
app.printer.header[2]=H.V. Hrvatinica bb
app.printer.header[3]=70101 Jajce

# Backup baze (H2 BACKUP TO — konzistentna kopija dok aplikacija radi)
# Druga lokacija (USB / Google Drive folder) postavlja se u Admin -> Postavke.
app.backup.dir=C:/megi/backup
app.backup.keep=30
app.backup.cron=0 45 22 * * *
